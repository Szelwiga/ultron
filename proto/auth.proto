syntax = "proto3";

package doki.auth;

option java_package = "com.doki.proto.auth";
option java_multiple_files = true;

// A user registered in the system.
message User {
  // Full handle in <name>#<tag> format.
  string username = 1;

  // Google primary email.
  string email = 2;

  // Google subject ID.
  string google_id = 3;
}

// Storage container for users in textproto format.
message UserDatabase {
  repeated User users = 1;
}

// An active authenticated session.
message Session {
  // Cryptographically secure session token.
  string session_token = 1;

  // Only the part after # (tag) used to distinguish the user.
  string user_tag = 2;

  // Expiration epoch in milliseconds.
  int64 expires_at_ms = 3;
}

// Storage container for sessions in textproto format.
message SessionDatabase {
  repeated Session sessions = 1;
}

// Request to authenticate using Google ID token.
message GoogleLoginRequest {
  string id_token = 1;
}

// Response from Google authentication attempt.
message GoogleLoginResponse {
  bool success = 1;
  string error_message = 2;
  bool needs_username_prompt = 3;
  string display_name = 4;
}

// Request to set/update display name (letters only).
message SetUsernameRequest {
  string desired_name = 1;
}

// Response for set username attempt.
message SetUsernameResponse {
  bool success = 1;
  string error_message = 2;
  string display_name = 3;
}

// Response returning currently logged in user info.
message GetMeResponse {
  bool authenticated = 1;
  string display_name = 2;
}
