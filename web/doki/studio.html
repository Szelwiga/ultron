<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doki Studio</title>
  <link rel="stylesheet" href="/common/theme.css">
  <link rel="stylesheet" href="/doki/studio.css">
  <script>
    (function() {
      const theme = localStorage.getItem('doki_theme');
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div id="app-container">
    <!-- Top Navigation Bar -->
    <header id="top-nav">
      <div class="nav-left">
        <div class="nav-brand">Doki</div>

        <!-- Workspace Switcher in Top-Left -->
        <div class="workspace-switcher">
          <button class="workspace-select-btn" id="ws-switcher-btn">
            <span id="current-ws-name">Personal</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </button>
          <div class="workspace-menu" id="ws-switcher-menu">
            <div id="ws-switcher-list"></div>
            <div class="workspace-menu-divider"></div>
            <div class="workspace-menu-item" id="ws-manage-menu-item">
              <span>Manage Workspaces...</span>
            </div>
          </div>
        </div>

        <!-- Tree Toggle Icon Button in Top-Left -->
        <button class="btn-icon" id="nav-tree-btn" title="Toggle File Tree">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
          </svg>
        </button>
      </div>

      <div class="nav-actions">
        <span class="user-pill" id="nav-user-display">User</span>
        <button class="btn-icon" id="nav-settings-btn" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <button class="btn btn-secondary" id="nav-logout-btn"
                style="padding: 6px 12px;">Logout</button>
      </div>
    </header>

    <!-- Canvas Container -->
    <div id="canvas-container">
      <!-- 1. Tree Viewer Tile (Floating Window) -->
      <aside id="tree-tile" class="floating-window">
        <div class="tree-header window-header">
          <div class="window-header-left">
            <div class="window-corner-drag" title="Drag to move">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="8" cy="6" r="1.5"/><circle cx="16" cy="6" r="1.5"/>
                <circle cx="8" cy="12" r="1.5"/><circle cx="16" cy="12" r="1.5"/>
                <circle cx="8" cy="18" r="1.5"/><circle cx="16" cy="18" r="1.5"/>
              </svg>
            </div>
            <span class="tree-title" id="tree-ws-title">Personal</span>
          </div>
          <div class="window-header-right tree-header-actions" style="display: flex; align-items: center; gap: 4px;">
            <button class="tree-item-action-btn" id="tree-header-new-file" title="New File" aria-label="New File">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="12" y1="18" x2="12" y2="12"/>
                <line x1="9" y1="15" x2="15" y2="15"/>
              </svg>
            </button>
            <button class="tree-item-action-btn" id="tree-header-new-dir" title="New Directory" aria-label="New Directory">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                <line x1="12" y1="11" x2="12" y2="17"/>
                <line x1="9" y1="14" x2="15" y2="14"/>
              </svg>
            </button>
            <button class="btn-icon tree-close-btn" id="tree-close-btn" title="Close Explorer" aria-label="Close Explorer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
        <div id="tree-body"></div>
      </aside>

      <!-- Welcome Tile (Blended into background when no editor tiles are open) -->
      <section id="welcome-tile" class="welcome-tile">
        <div class="welcome-content">
          <div class="welcome-header">
            <h1 class="welcome-title" id="welcome-greeting">Hi User</h1>
            <p class="welcome-subtitle">Welcome to Doki Studio. Select a document from explorer to start editing.</p>
          </div>
          <div class="welcome-recent-section" id="welcome-recent-section">
            <div class="welcome-section-label">Recent Documents</div>
            <div class="welcome-recent-list" id="welcome-recent-list">
              <!-- Dynamically populated -->
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- 3. Settings Tile (Takes Full Canvas Below Top Nav) -->
    <div id="settings-tile">
      <div class="settings-content">
        <div class="settings-header">
          <h2>Settings</h2>
          <button class="btn btn-secondary" id="close-settings-btn">Close</button>
        </div>

        <div id="username-banner" class="banner banner-warning"
             style="display: none;">
          <span>Please set yourself a username</span>
        </div>

        <div class="settings-section-title">
          <span>Profile</span>
        </div>

        <div class="settings-group">
          <label>Google Email</label>
          <div class="settings-readonly-value"
               id="settings-email">email@example.com</div>
        </div>

        <div class="settings-group">
          <label for="settings-username-input">Username (letters only)</label>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="settings-username-input" class="input-text"
                   placeholder="Enter username (a-zA-Z)">
            <button class="btn btn-primary"
                    id="settings-save-username-btn">Save</button>
          </div>
          <div id="settings-feedback"
               style="font-size: 13px; margin-top: 8px; display: none;"></div>
        </div>

        <div class="settings-section-title">
          <span>Appearance</span>
        </div>

        <div class="settings-group">
          <label>Theme</label>
          <div class="theme-switch-group">
            <button type="button" class="theme-option-btn" id="theme-btn-light" data-theme="light">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
              </svg>
              <span>Light</span>
            </button>
            <button type="button" class="theme-option-btn" id="theme-btn-dark" data-theme="dark">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
              <span>Dark</span>
            </button>
          </div>
        </div>

        <div class="settings-section-title">
          <span>Workspaces</span>
          <span id="ws-count-badge"
                style="font-size: 13px; color: var(--text-secondary);"></span>
        </div>

        <div class="ws-card">
          <div style="font-weight: 600; font-size: 14px; margin-bottom: 12px;">
            Create New Workspace
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <input type="text" id="new-ws-name" class="input-text"
                   placeholder="Workspace name">
            <input type="text" id="new-ws-desc" class="input-text"
                   placeholder="Description (optional)">
            <div style="display: flex; justify-content: flex-end;">
              <button class="btn btn-primary" id="create-ws-btn">
                Create Workspace
              </button>
            </div>
          </div>
        </div>

        <div id="workspaces-list-container"></div>
      </div>
    </div>
  </div>

  <script src="/doki/dialog.js"></script>
  <script src="/doki/tree_icons.js"></script>
  <script src="/doki/tree_api.js"></script>
  <script src="/doki/tree_handlers.js"></script>
  <script src="/doki/dock.js"></script>
  <script src="/doki/editor.js"></script>
  <script src="/doki/tree.js"></script>
  <script src="/doki/settings.js"></script>
  <script src="/doki/studio.js"></script>
</body>
</html>
