<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doki Studio</title>
  <link rel="stylesheet" href="/common/theme.css">
  <link rel="stylesheet" href="/doki/studio.css">
</head>
<body>
  <div id="app-container">
    <!-- Top Navigation Bar -->
    <header id="top-nav">
      <div class="nav-left">
        <div class="nav-brand">Doki</div>

        <!-- Workspace Switcher in Top-Left -->
        <div class="workspace-switcher">
          <button class="workspace-select-btn" id="ws-switcher-btn">
            <span id="current-ws-name">Personal</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </button>
          <div class="workspace-menu" id="ws-switcher-menu">
            <div id="ws-switcher-list"></div>
            <div class="workspace-menu-divider"></div>
            <div class="workspace-menu-item" id="ws-manage-menu-item">
              <span>Manage Workspaces...</span>
            </div>
          </div>
        </div>

        <!-- Tree Toggle Icon Button in Top-Left -->
        <button class="btn-icon" id="nav-tree-btn" title="Toggle File Tree">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
          </svg>
        </button>
      </div>

      <div class="nav-actions">
        <span class="user-pill" id="nav-user-display">User</span>
        <button class="btn-icon" id="nav-settings-btn" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <button class="btn btn-secondary" id="nav-logout-btn"
                style="padding: 6px 12px;">Logout</button>
      </div>
    </header>

    <!-- Canvas Container -->
    <div id="canvas-container">
      <!-- 1. Tree Viewer Tile (Floating Window) -->
      <aside id="tree-tile" class="floating-window">
        <div class="tree-header window-header">
          <div class="window-header-left">
            <div class="window-corner-drag" title="Drag to move">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="8" cy="6" r="1.5"/><circle cx="16" cy="6" r="1.5"/>
                <circle cx="8" cy="12" r="1.5"/><circle cx="16" cy="12" r="1.5"/>
                <circle cx="8" cy="18" r="1.5"/><circle cx="16" cy="18" r="1.5"/>
              </svg>
            </div>
            <span class="tree-title">Explorer</span>
          </div>
        </div>
        <div id="tree-body"></div>
      </aside>

      <!-- 2. Document Editor Tile (Floating Window) -->
      <main id="doc-editor-tile" class="floating-window">
        <div id="doc-empty-state" class="editor-empty">
          <div class="editor-header window-header" style="width: 100%;">
            <div class="window-header-left">
              <div class="window-corner-drag" title="Drag to move">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                  <circle cx="8" cy="6" r="1.5"/><circle cx="16" cy="6" r="1.5"/>
                  <circle cx="8" cy="12" r="1.5"/><circle cx="16" cy="12" r="1.5"/>
                  <circle cx="8" cy="18" r="1.5"/><circle cx="16" cy="18" r="1.5"/>
                </svg>
              </div>
              <span class="editor-doc-name" style="color: var(--text-secondary); font-size: 13px;">Editor</span>
            </div>
          </div>
          <div class="editor-empty-content">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
                 stroke="var(--text-muted)" stroke-width="1.5"
                 style="margin-bottom: 12px;">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <p>Select a document from the explorer tree to view or edit</p>
          </div>
        </div>

        <div id="doc-active-state"
             style="display: none; flex-direction: column; height: 100%; width: 100%; flex: 1;">
          <div class="editor-header window-header">
            <div class="window-header-left">
              <div class="window-corner-drag" title="Drag to move">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                  <circle cx="8" cy="6" r="1.5"/><circle cx="16" cy="6" r="1.5"/>
                  <circle cx="8" cy="12" r="1.5"/><circle cx="16" cy="12" r="1.5"/>
                  <circle cx="8" cy="18" r="1.5"/><circle cx="16" cy="18" r="1.5"/>
                </svg>
              </div>
              <div class="editor-title-container">
                <span id="doc-title" class="editor-doc-name">document.md</span>
                <span id="doc-save-badge" class="editor-save-badge">Saved</span>
              </div>
            </div>
            <button class="btn btn-secondary" id="doc-save-btn"
                    style="padding: 4px 12px; font-size: 13px;">Save</button>
          </div>
          <div class="editor-body">
            <textarea id="doc-textarea" placeholder="Type document content here..."
                      spellcheck="false"></textarea>
          </div>
        </div>
      </main>
    </div>

    <!-- 3. Settings Tile (Takes Full Canvas Below Top Nav) -->
    <div id="settings-tile">
      <div class="settings-content">
        <div class="settings-header">
          <h2>Settings</h2>
          <button class="btn btn-secondary" id="close-settings-btn">Close</button>
        </div>

        <div id="username-banner" class="banner banner-warning"
             style="display: none;">
          <span>Please set yourself a username</span>
        </div>

        <div class="settings-section-title">
          <span>Profile</span>
        </div>

        <div class="settings-group">
          <label>Google Email</label>
          <div class="settings-readonly-value"
               id="settings-email">email@example.com</div>
        </div>

        <div class="settings-group">
          <label for="settings-username-input">Username (letters only)</label>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="settings-username-input" class="input-text"
                   placeholder="Enter username (a-zA-Z)">
            <button class="btn btn-primary"
                    id="settings-save-username-btn">Save</button>
          </div>
          <div id="settings-feedback"
               style="font-size: 13px; margin-top: 8px; display: none;"></div>
        </div>

        <div class="settings-section-title">
          <span>Workspaces</span>
          <span id="ws-count-badge"
                style="font-size: 13px; color: var(--text-secondary);"></span>
        </div>

        <div class="ws-card">
          <div style="font-weight: 600; font-size: 14px; margin-bottom: 12px;">
            Create New Workspace
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <input type="text" id="new-ws-name" class="input-text"
                   placeholder="Workspace name">
            <input type="text" id="new-ws-desc" class="input-text"
                   placeholder="Description (optional)">
            <div style="display: flex; justify-content: flex-end;">
              <button class="btn btn-primary" id="create-ws-btn">
                Create Workspace
              </button>
            </div>
          </div>
        </div>

        <div id="workspaces-list-container"></div>
      </div>
    </div>
  </div>

  <!-- Name Prompt Modal Dialog (Disallows Spaces) -->
  <div id="name-prompt-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title" id="prompt-title">New Item</div>
      <input type="text" id="prompt-input" class="input-text"
             placeholder="Name (no spaces allowed)">
      <div id="prompt-error" class="modal-error"></div>
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
        <button class="btn btn-secondary" id="prompt-cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="prompt-submit-btn">OK</button>
      </div>
    </div>
  </div>

  <script src="/doki/tree_icons.js"></script>
  <script src="/doki/tree_api.js"></script>
  <script src="/doki/tree_handlers.js"></script>
  <script src="/doki/editor.js"></script>
  <script src="/doki/tree.js"></script>
  <script src="/doki/settings.js"></script>
  <script src="/doki/dock.js"></script>
  <script src="/doki/studio.js"></script>
</body>
</html>
