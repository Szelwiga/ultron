<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doki</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
    }
    .view { display: none; }
    .view.active { display: flex; }

    /* Login View */
    #login-view {
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 1px solid #334155;
    }
    h1 { margin: 0 0 0.5rem; color: #38bdf8; font-size: 2rem; }
    p.subtitle { color: #94a3b8; margin: 0 0 2rem; font-size: 0.95rem; }
    .btn {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1rem;
      transition: background 0.15s;
    }
    .btn:hover { background: #f1f5f9; }
    .status {
      margin-top: 1.25rem;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      display: none;
    }
    .status.info { display: block; background: #0c4a6e; color: #bae6fd; }
    .status.error { display: block; background: #7f1d1d; color: #fecaca; }

    /* Prompt Modal */
    .prompt-box {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #334155;
      text-align: left;
    }
    .prompt-box label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
    }
    .prompt-box input {
      width: 100%;
      padding: 0.7rem;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 0.75rem;
    }
    .prompt-box button {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 0.7rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .prompt-box button:hover { background: #0369a1; }

    /* Workspace View */
    #workspace-view {
      flex-direction: column;
      height: 100vh;
    }
    header.topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1.5rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .logo { font-weight: 700; color: #38bdf8; font-size: 1.2rem; }
    .user-info { display: flex; align-items: center; gap: 1rem; }
    .user-pill {
      background: #334155;
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.9rem;
      color: #f1f5f9;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .logout-btn:hover { background: #334155; color: #fff; }
    .empty-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #64748b;
    }
    .empty-workspace h2 { color: #94a3b8; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <!-- 1. Login View -->
  <div id="login-view" class="view active">
    <div class="card">
      <h1>Doki</h1>
      <p class="subtitle">AI document workspace</p>

      <div id="login-controls">
        <button class="btn" id="google-login-btn">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Sign in with Google
        </button>
      </div>

      <div id="status" class="status"></div>

      <!-- Set Username Prompt (First-time login) -->
      <div id="username-prompt" class="prompt-box" style="display:none;">
        <label for="desired-name">Choose your display name (letters only):</label>
        <input type="text" id="desired-name" pattern="[a-zA-Z]+" placeholder="e.g. Alice">
        <button id="save-username-btn">Save Username & Continue</button>
      </div>
    </div>
  </div>

  <!-- 2. Authenticated Empty Workspace View -->
  <div id="workspace-view" class="view">
    <header class="topbar">
      <div class="logo">Doki</div>
      <div class="user-info">
        <div class="user-pill" id="user-display-pill">User</div>
        <button class="logout-btn" id="logout-btn">Log out</button>
      </div>
    </header>
    <div class="empty-workspace">
      <h2>Workspace (Empty)</h2>
      <p>You are successfully authenticated. Workspace tiles will appear here.</p>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/login/login.js"></script>
</body>
</html>
