<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doki</title>
  <link rel="stylesheet" href="/common/theme.css">
  <style>
    /* App Shell Layout */
    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background-color: var(--bg-secondary);
    }

    /* Views */
    .view { display: none; width: 100%; height: 100%; }
    .view.active { display: flex; }

    /* Login View */
    #login-view {
      align-items: center;
      justify-content: center;
      background-color: var(--bg-secondary);
    }
    .login-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: var(--card-shadow);
    }
    .login-card h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .login-card p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 32px;
    }
    .status-msg {
      margin-top: 16px;
      font-size: 13px;
      display: none;
    }
    .status-msg.error { display: block; color: var(--danger); }
    .status-msg.info { display: block; color: var(--primary); }

    /* Top Nav Bar (web/nav) */
    #top-nav {
      height: var(--header-height);
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .nav-brand {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    /* Workspace Switcher in Top-Left */
    .workspace-switcher {
      position: relative;
    }
    .workspace-select-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
    }
    .workspace-select-btn:hover {
      background: var(--border-color);
    }
    .workspace-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-shadow: var(--card-shadow);
      min-width: 220px;
      display: none;
      flex-direction: column;
      z-index: 20;
    }
    .workspace-menu.open {
      display: flex;
    }
    .workspace-menu-item {
      padding: 8px 12px;
      font-size: 13px;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .workspace-menu-item:hover {
      background: var(--bg-tertiary);
    }
    .workspace-menu-item.active {
      font-weight: 600;
      color: var(--primary);
    }
    .workspace-menu-divider {
      height: 1px;
      background: var(--border-color);
      margin: 4px 0;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-pill {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      background-color: var(--bg-tertiary);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* Canvas (web/canvas) */
    #canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
    }

    /* Workspace Empty State */
    #workspace-canvas {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }
    #workspace-canvas h2 {
      font-size: 20px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    /* Settings Tile (Takes Full Canvas) */
    #settings-tile {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-primary);
      display: none;
      flex-direction: column;
      padding: 32px;
      overflow-y: auto;
      z-index: 5;
    }
    #settings-tile.open {
      display: flex;
    }
    .settings-content {
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
    }
    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .settings-header h2 {
      font-size: 22px;
      font-weight: 600;
    }
    .settings-section-title {
      font-size: 16px;
      font-weight: 600;
      margin: 28px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .settings-group {
      margin-bottom: 20px;
    }
    .settings-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .settings-readonly-value {
      font-size: 14px;
      color: var(--text-primary);
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    /* Workspace Management Card */
    .ws-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .ws-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .ws-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .ws-badge {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 12px;
      background: #e0f2fe;
      color: #0369a1;
    }
    .collab-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <!-- 1. Login View -->
    <div id="login-view" class="view active">
      <div class="login-card">
        <h1>Doki</h1>
        <p>AI document workspace</p>
        <div id="google-login-container">
          <button class="btn btn-secondary" id="google-login-btn" style="width: 100%;">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Sign in with Google
          </button>
        </div>
        <div id="login-status" class="status-msg"></div>
      </div>
    </div>

    <!-- 2. Main Authenticated Application View -->
    <div id="main-view" class="view" style="flex-direction: column;">
      <!-- Top Navigation Bar (web/nav) -->
      <header id="top-nav">
        <div class="nav-left">
          <div class="nav-brand">Doki</div>

          <!-- Workspace Switcher in Top-Left Corner -->
          <div class="workspace-switcher">
            <button class="workspace-select-btn" id="ws-switcher-btn">
              <span id="current-ws-name">My Workspace</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>
            <div class="workspace-menu" id="ws-switcher-menu">
              <div id="ws-switcher-list"></div>
              <div class="workspace-menu-divider"></div>
              <div class="workspace-menu-item" id="ws-manage-menu-item">
                <span>Manage Workspaces...</span>
              </div>
            </div>
          </div>
        </div>

        <div class="nav-actions">
          <span class="user-pill" id="nav-user-display">User</span>
          <!-- Settings Icon Button -->
          <button class="btn-icon" id="nav-settings-btn" title="Settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
          <button class="btn btn-secondary" id="nav-logout-btn" style="padding: 6px 12px;">Logout</button>
        </div>
      </header>

      <!-- Canvas Container (web/canvas) -->
      <div id="canvas-container">
        <!-- Default Workspace Canvas -->
        <div id="workspace-canvas">
          <h2 id="canvas-ws-title">Workspace</h2>
          <p>Document workspace tiles will appear here.</p>
        </div>

        <!-- Settings Tile (Takes Full Canvas) -->
        <div id="settings-tile">
          <div class="settings-content">
            <div class="settings-header">
              <h2>Settings</h2>
              <button class="btn btn-secondary" id="close-settings-btn">Close</button>
            </div>

            <!-- Mandatory Username Banner (shown if username is empty) -->
            <div id="username-banner" class="banner banner-warning" style="display: none;">
              <span>Please set yourself a username</span>
            </div>

            <!-- Profile Section -->
            <div class="settings-section-title">
              <span>Profile</span>
            </div>

            <div class="settings-group">
              <label>Google Email</label>
              <div class="settings-readonly-value" id="settings-email">email@example.com</div>
            </div>

            <div class="settings-group">
              <label for="settings-username-input">Username (letters only)</label>
              <div style="display: flex; gap: 8px;">
                <input type="text" id="settings-username-input" class="input-text" placeholder="Enter username (a-zA-Z)">
                <button class="btn btn-primary" id="settings-save-username-btn">Save</button>
              </div>
              <div id="settings-feedback" style="font-size: 13px; margin-top: 8px; display: none;"></div>
            </div>

            <!-- Workspaces Section -->
            <div class="settings-section-title">
              <span>Workspaces</span>
              <span id="ws-count-badge" style="font-size: 13px; font-weight: normal; color: var(--text-secondary);"></span>
            </div>

            <!-- Create New Workspace Form -->
            <div class="ws-card">
              <div style="font-weight: 600; font-size: 14px; margin-bottom: 12px;">Create New Workspace</div>
              <div style="display: flex; flex-direction: column; gap: 8px;">
                <input type="text" id="new-ws-name" class="input-text" placeholder="Workspace name">
                <input type="text" id="new-ws-desc" class="input-text" placeholder="Description (optional)">
                <div style="display: flex; justify-content: flex-end;">
                  <button class="btn btn-primary" id="create-ws-btn">Create Workspace</button>
                </div>
              </div>
            </div>

            <!-- Workspaces List -->
            <div id="workspaces-list-container"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/login/login.js"></script>
</body>
</html>
