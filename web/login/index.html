<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doki - Login</title>
  <link rel="stylesheet" href="/common/theme.css">
  <script>
    (function() {
      const theme = localStorage.getItem('doki_theme');
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background-color: var(--bg-secondary);
      margin: 0;
    }
    .login-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: var(--card-shadow);
    }
    .login-card h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent-strong);
      margin-bottom: 8px;
    }
    .login-card p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 32px;
    }
    .status-msg {
      margin-top: 16px;
      font-size: 13px;
      display: none;
    }
    .status-msg.error { display: block; color: var(--danger); }
    .status-msg.info { display: block; color: var(--primary); }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Doki</h1>
    <p>AI document workspace</p>
    <div id="google-login-container">
      <button class="btn btn-secondary" id="google-login-btn"
              style="width: 100%;">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign in with Google
      </button>
    </div>
    <div id="login-status" class="status-msg"></div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/login/login.js"></script>
</body>
</html>
